<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Iniciar sesión</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #EEF1F5; min-height: 100vh; display: flex; align-items: center;
    justify-content: center; padding: 16px; color: #1c2530;
  }
  .box {
    background: #fff; border-radius: 12px; padding: 28px 24px; width: 100%;
    max-width: 360px; box-shadow: 0 2px 10px rgba(22,35,59,0.1); border: 1px solid #e3e8ee;
  }
  h1 { font-size: 18px; color: #16233B; text-align: center; margin-bottom: 4px; }
  .subtitle { font-size: 12.5px; color: #5b6b80; text-align: center; margin-bottom: 20px; }
  label { font-size: 11px; font-weight: 700; color: #2B4C7E; display: block; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  input { width: 100%; border: 1.5px solid #dde3ea; border-radius: 6px; padding: 10px; font-size: 14px; outline: none; margin-bottom: 14px; }
  input:focus { border-color: #2B4C7E; }
  button { width: 100%; background: #16233B; color: #fff; border: none; border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 700; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: not-allowed; }
  .error { color: #b3261e; font-size: 12.5px; text-align: center; margin-top: 12px; display: none; }
</style>
</head>
<body>
  <div class="box">
    <h1>🔒 Iniciar sesión</h1>
    <p class="subtitle">Envío de WhatsApp, SMS y Correo</p>
    <form id="loginForm">
      <label>Usuario</label>
      <input type="text" id="username" autocomplete="username" required>
      <label>Contraseña</label>
      <input type="password" id="password" autocomplete="current-password" required>
      <button type="submit" id="btnLogin">Entrar</button>
    </form>
    <p class="error" id="errorMsg"></p>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("btnLogin");
      const errEl = document.getElementById("errorMsg");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Entrando...";

      try {
        const res = await fetch("/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            username: document.getElementById("username").value.trim(),
            password: document.getElementById("password").value
          })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "No se pudo iniciar sesión");
        window.location.href = "/app.html";
      } catch (err) {
        errEl.textContent = "⚠️ " + err.message;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "Entrar";
      }
    });
  </script>
</body>
</html>
